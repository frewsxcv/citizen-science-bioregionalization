name: Run

on: push

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: local-archive
            source_path: test/sample-archive/
            min_lat: 40
            max_lat: 50
            min_lon: 5
            max_lon: 10
            limit_results: 5000
            geocode_precision: 8
            min_clusters: 2
            max_clusters: 10
            output_dir: output
          - name: gbif-snapshot
            source_path: gs://public-datasets-gbif/occurrence/2026-01-01/occurrence.parquet/
            min_lat: 25
            max_lat: 47
            min_lon: -87
            max_lon: -66
            # The cap is off: it bound, and it bound unevenly. This bbox holds
            # 657,577,409 records, so 300M discarded 54.4% of them -- and
            # `limit` takes the first N in scan order, which for a GBIF snapshot
            # is grouped by source dataset. The retained half was therefore a
            # sample of whichever datasets sort earliest, not of the region.
            #
            # Removing it starved the runner once before. The cause was the land
            # mask buffering every record of every hexagon to draw its sample;
            # that is now a stateless per-row test (see
            # filter_terrestrial_geocodes_lf), measured at 8.3 GB on the full
            # 658M records against 13.9 GB for the old code at the 300M cap.
            no_limit: true
            # This bbox is 58% open water -- the US East Coast runs diagonally
            # across it, so no rectangle excludes the Atlantic and the Gulf.
            # Without the mask the run just rediscovers the coastline: the two
            # published regions were mesopelagic fish (Cyclothone, tuna,
            # swordfish) against North American landbirds and waterfowl, and k
            # bottomed out at the low end of the range because that one split
            # consumed the whole signal.
            terrestrial_only: true
            geocode_precision: 4
            min_clusters: 2
            max_clusters: 15
            max_taxa: 10000
            min_geocode_presence: 0.02
            output_dir: output-gbif
    permissions:
      contents: "read"
      id-token: "write"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: "google-github-actions/auth@v3"
        with:
          credentials_json: "${{ secrets.GCP_SERVICE_ACCOUNT }}"
      - name: Install Rust
        # bioregion-rs is a uv workspace member (see root pyproject.toml);
        # `uv sync`/`uv run` below build it via maturin, which needs cargo.
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          # Excludes bioregion_rs/target/wheels -- see bioregion-rs.yml for why.
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            bioregion_rs/target/debug
            bioregion_rs/target/release
          key: ${{ runner.os }}-cargo-${{ hashFiles('bioregion_rs/Cargo.lock') }}
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - name: Lint notebook
        if: matrix.name == 'local-archive'
        run: uv run marimo check notebook.py
      - name: Run and export notebook (${{ matrix.name }})
        run: |
          uv run marimo export html notebook.py -o ${{ matrix.output_dir }}/index.html --force -- \
            --no-stop \
            --geocode-precision=${{ matrix.geocode_precision }} \
            --min-clusters=${{ matrix.min_clusters }} \
            --max-clusters=${{ matrix.max_clusters }} \
            --log-file=/dev/stdout \
            --min-lat=${{ matrix.min_lat }} \
            --max-lat=${{ matrix.max_lat }} \
            --min-lon=${{ matrix.min_lon }} \
            --max-lon=${{ matrix.max_lon }} \
            ${{ matrix.terrestrial_only && '--terrestrial-only' || '' }} \
            ${{ matrix.no_limit && '--no-limit' || '' }} \
            ${{ matrix.limit_results != null && format('--limit-results={0}', matrix.limit_results) || '' }} \
            ${{ matrix.max_taxa != null && format('--max-taxa={0}', matrix.max_taxa) || '' }} \
            ${{ matrix.min_geocode_presence != null && format('--min-geocode-presence={0}', matrix.min_geocode_presence) || '' }} \
            --parquet-source-path="${{ matrix.source_path }}"
      - name: Report disk usage
        if: always() && matrix.name == 'gbif-snapshot'
        # materialize_parquet spills each stage and only prunes at process
        # exit, so the intermediates coexist -- uncapped, the two Darwin Core
        # spills are ~6.8 GB each. A first run reported 107 GB free, so this is
        # reporting rather than a constraint, and there is nothing to clear: an
        # earlier version of this step freed the runner's toolchains and took
        # uv out with them.
        run: df -h /

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend dependencies and build
        working-directory: frontend
        run: |
          npm install
          npm run build
      - name: Move frontend to output
        run: mv frontend/dist ${{ matrix.output_dir }}/frontend
      - name: Copy aggregations.json
        run: cp frontend/aggregations.json ${{ matrix.output_dir }}/frontend/aggregations.json
      - name: 📦 Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ matrix.output_dir }}/
          name: github-pages-${{ matrix.name }}

  deploy:
    needs: build
    # Only deploy from the default branch. The github-pages environment is
    # protected to main, so running this on PR branches only ever fails.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      pages: write
      id-token: write

    steps:
      - name: 🌐 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-gbif-snapshot

[project]
name = "inaturalist-ecoregions"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "altair>=6.3.0",
    "bioregion-rs",
    "black>=26.5.1",
    "folium>=0.20.0",
    "geojson>=3.3.0",
    "google-auth>=2.58.0",
    "ipython>=9.17.1",
    "kneed>=0.8.6",
    "marimo>=0.24.2",
    "matplotlib>=3.11.2",
    "networkx>=3.7",
    "numba>=0.67.0",
    "polars-h3>=0.7.1",
    "polars-st>=0.9.0",
    "polars>=1.44.2",
    "pyarrow>=25.0.1",
    "pyright>=1.1.414",
    "scikit-bio>=0.7.4",
    "scikit-learn>=1.9.1",
    "scipy-stubs>=1.18.1.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "shapely>=2.1.2",
    "types-networkx>=3.6.1.20260911",
    "types-seaborn>=0.13.2.20260728",
    "types-shapely>=2.1.0.20260728",
    "umap-learn>=0.5.12",
]

[tool.pyright]
typeCheckingMode = "standard"
# bioregion_rs is a separate Rust/maturin sub-project; its Python is a dev harness
# that imports the compiled extension module (no stubs, not built in the pyright CI
# job). Exclude it so pyright doesn't treat the crate dir as a namespace package.
# NOTE: specifying `exclude` replaces pyright's defaults, so the default patterns
# (including `**/.*`, which excludes `.venv`/`.git`) must be repeated here.
exclude = [
    "**/node_modules",
    "**/__pycache__",
    "**/.*",
    "bioregion_rs",
]

[dependency-groups]
dev = [
    "maturin>=1.15.0",
]

[tool.uv.workspace]
members = ["bioregion_rs"]

[tool.uv.sources]
bioregion-rs = { workspace = true }
